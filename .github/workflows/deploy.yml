name: Deploy Northwind & Blazor to Debian

on:
  push:
    branches: [ "main", "master" ] # Se ejecutará si haces push a main o master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    # 1. Compilar la solución (.slnx)
    - name: Build Solution
      run: dotnet build "Northwind.slnx" -c Release

    # 2. Publicar WebApi (ruta directa en la raíz)
    - name: Publish WebApi
      run: dotnet publish "NorthWind.Sales.WebApi/NorthWind.Sales.WebApi.csproj" -c Release -o ./PublishNorthWind

    # 3. Publicar BlazorClient (ruta directa en la raíz)
    - name: Publish BlazorClient
      run: dotnet publish "NorthWind.Sales.BlazorClient/NorthWind.Sales.BlazorClient.csproj" -c Release -o ./PublishBlazor

    # 4. Copiar archivos de WebApi al servidor
    - name: Copy WebApi files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishNorthWind/*"
        target: "/var/www/northwind" 

    # 5. Copiar archivos de Blazor (solo la carpeta wwwroot) al servidor
    - name: Copy Blazor files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishBlazor/wwwroot/*"
        target: "/var/www/blazor/wwwroot"

    # 6. Ejecutar comandos en el servidor
    - name: Execute Server Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # Permisos para WebApi (Ojo con la W mayúscula de NorthWind en tu Debian)
          sudo chown -R natasha:natasha /var/www/NorthWind/wwwroot
          
          # Permisos para Blazor
          sudo chown -R www-data:www-data /var/www/blazor/wwwroot
          
          # Reiniciar servicios
          sudo systemctl restart northwind.service
          sudo systemctl reload nginx
          
          echo "¡Despliegue de WebApi y Blazor completado!"
