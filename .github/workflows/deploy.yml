name: Deploy Northwind & React to Debian

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Conectar a Tailscale
    - name: Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    # 2. Configurar .NET 10
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    # 3. Compilar y publicar el Backend (WebApi)
    - name: Publish WebApi
      run: dotnet publish "NorthWind.Sales.WebApi/NorthWind.Sales.WebApi.csproj" -c Release -o ./PublishNorthWind

    # 4. Configurar Node.js para React
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 5. Instalar dependencias y compilar React
    - name: Build React Frontend
      working-directory: ./NorthWind.Sales.ReactClient
      run: |
        npm install
        npm run build

    # 6. Copiar Backend a carpeta temporal
    - name: Copy WebApi files to temp
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishNorthWind/*"
        target: "/tmp/deploy_webapi" 

    # 7. Copiar React (carpeta dist) a carpeta temporal
    - name: Copy React files to temp
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./NorthWind.Sales.ReactClient/dist/*"
        target: "/tmp/deploy_react"

    # 8. Mover archivos a su destino final, asignar permisos y reiniciar
    - name: Execute Server Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # --- PROCESO PARA WEBAPI ---
          sudo mkdir -p /var/www/northwind
          sudo cp -r /tmp/deploy_webapi/* /var/www/northwind/
          sudo chown -R natasha:natasha /var/www/NorthWind/wwwroot
          
          # --- PROCESO PARA REACT ---
          sudo mkdir -p /var/www/blazor/wwwroot 
          sudo rm -rf /var/www/blazor/wwwroot/*
          sudo cp -r /tmp/deploy_react/* /var/www/blazor/wwwroot/
          sudo chown -R www-data:www-data /var/www/blazor/wwwroot
          
          # --- LIMPIEZA ---
          rm -rf /tmp/deploy_webapi
          rm -rf /tmp/deploy_react
          
          # --- REINICIO DE SERVICIOS ---
          sudo systemctl restart northwind.service
          sudo systemctl reload nginx
          
          echo "¡Despliegue de .NET y React completado con éxito!"
