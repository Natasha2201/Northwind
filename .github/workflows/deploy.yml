name: Deploy Northwind & Blazor to Debian

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Conectar a la red de Tailscale
    - name: Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    # 2. Configurar .NET 10
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    # 3. Compilar la solución (usando .slnx)
    - name: Build Solution
      run: dotnet build "Northwind.slnx" -c Release

    # 4. Publicar WebApi
    - name: Publish WebApi
      run: dotnet publish "NorthWind.Sales.WebApi/NorthWind.Sales.WebApi.csproj" -c Release -o ./PublishNorthWind

    # 5. Publicar BlazorClient
    - name: Publish BlazorClient
      run: dotnet publish "NorthWind.Sales.BlazorClient/NorthWind.Sales.BlazorClient.csproj" -c Release -o ./PublishBlazor

    # 6. Copiar archivos de WebApi al servidor
    - name: Copy WebApi files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishNorthWind/*"
        target: "/var/www/northwind" 

    # 7. Copiar archivos de Blazor (solo la carpeta wwwroot)
    - name: Copy Blazor files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishBlazor/wwwroot/*"
        target: "/var/www/blazor/wwwroot"

    # 8. Ejecutar comandos finales en el servidor
    - name: Execute Server Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          sudo chown -R natasha:natasha /var/www/NorthWind/wwwroot
          sudo chown -R www-data:www-data /var/www/blazor/wwwroot
          sudo systemctl restart northwind.service
          sudo systemctl reload nginx
          echo "¡Despliegue completado con éxito!"
