name: Deploy Northwind & Blazor to Debian

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Configurar .NET 10
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    # 2. Compilar TODA la solución (esto arregla el error de "Project file does not exist")
    - name: Build Solution
      run: dotnet build Northwind.sln -c Release

    # 3. Publicar WebApi usando el nombre del proyecto directamente
    - name: Publish WebApi
      run: dotnet publish UI/NorthWind.Sales.WebApi/NorthWind.Sales.WebApi.csproj -c Release -o ./PublishNorthWind

    # 4. Publicar BlazorClient
    - name: Publish BlazorClient
      run: dotnet publish UI/Uls/NorthWind.Sales.BlazorClient/NorthWind.Sales.BlazorClient.csproj -c Release -o ./PublishBlazor

    # 5. Copiar archivos de WebApi al servidor
    - name: Copy WebApi files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishNorthWind/*"
        target: "/var/www/northwind" 

    # 6. Copiar archivos de Blazor (solo la carpeta wwwroot) al servidor
    - name: Copy Blazor files
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishBlazor/wwwroot/*"
        target: "/var/www/blazor/wwwroot"

    # 7. Ejecutar comandos en el servidor
    - name: Execute Server Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # Permisos para WebApi
          sudo chown -R natasha:natasha /var/www/NorthWind/wwwroot
          
          # Permisos para Blazor
          sudo chown -R www-data:www-data /var/www/blazor/wwwroot
          
          # Reiniciar servicios
          sudo systemctl restart northwind.service
          sudo systemctl reload nginx
          
          echo "¡Despliegue completado!"
