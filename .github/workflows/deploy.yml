name: Deploy Northwind & Blazor to Debian

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 1. Conectar a la red de Tailscale
    - name: Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

    # 2. Configurar .NET 10
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    # 3. Compilar la solución (usando el archivo .slnx)
    - name: Build Solution
      run: dotnet build "Northwind.slnx" -c Release

    # 4. Publicar WebApi
    - name: Publish WebApi
      run: dotnet publish "NorthWind.Sales.WebApi/NorthWind.Sales.WebApi.csproj" -c Release -o ./PublishNorthWind

    # 5. Publicar BlazorClient
    - name: Publish BlazorClient
      run: dotnet publish "NorthWind.Sales.BlazorClient/NorthWind.Sales.BlazorClient.csproj" -c Release -o ./PublishBlazor

    # 6. Copiar WebApi a carpeta temporal en el servidor
    - name: Copy WebApi files to temp
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishNorthWind/*"
        target: "/tmp/deploy_webapi" 

    # 7. Copiar Blazor a carpeta temporal en el servidor
    - name: Copy Blazor files to temp
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "./PublishBlazor/wwwroot/*"
        target: "/tmp/deploy_blazor"

    # 8. Mover archivos a su destino final, asignar permisos y reiniciar
    - name: Execute Server Commands
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        script: |
          # --- PROCESO PARA WEBAPI ---
          sudo mkdir -p /var/www/northwind
          sudo cp -r /tmp/deploy_webapi/* /var/www/northwind/
          sudo chown -R natasha:natasha /var/www/NorthWind/wwwroot
          
          # --- PROCESO PARA BLAZOR ---
          sudo mkdir -p /var/www/blazor/wwwroot
          sudo cp -r /tmp/deploy_blazor/* /var/www/blazor/wwwroot/
          sudo chown -R www-data:www-data /var/www/blazor/wwwroot
          
          # --- LIMPIEZA ---
          rm -rf /tmp/deploy_webapi
          rm -rf /tmp/deploy_blazor
          
          # --- REINICIO DE SERVICIOS ---
          sudo systemctl restart northwind.service
          sudo systemctl reload nginx
          
          echo "¡Despliegue completado con éxito y sin errores de permisos!"
