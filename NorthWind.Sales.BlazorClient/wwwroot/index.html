<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NorthWind.Sales.BlazorClient</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="NorthWind.Sales.BlazorClient.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            document.body.appendChild(anchorElement);
            anchorElement.click();
            document.body.removeChild(anchorElement);
            URL.revokeObjectURL(url);
        };

        window.downloadPdfFromBase64 = (fileName, base64String) => {
            const byteCharacters = atob(base64String);
            const byteNumbers = new Uint8Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const blob = new Blob([byteNumbers], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? 'factura.pdf';
            document.body.appendChild(anchorElement);
            anchorElement.click();
            document.body.removeChild(anchorElement);
            URL.revokeObjectURL(url);
        };

        const invoicePrintWindows = new Map();
        window.openInvoicePrintWindow = () => {
            const printWindow = window.open('', '_blank');
            if (!printWindow) return null;
            const windowId = globalThis.crypto?.randomUUID?.()
                ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            invoicePrintWindows.set(windowId, printWindow);
            printWindow.document.write('<!doctype html><html><head><title>Imprimir factura</title></head><body style="margin:0"><p style="font:16px sans-serif;padding:16px">Preparando factura para imprimir...</p></body></html>');
            printWindow.document.close();
            return windowId;
        };

        window.printInvoiceDocument = (windowId, invoice) => {
            const printWindow = invoicePrintWindows.get(windowId);
            invoicePrintWindows.delete(windowId);
            if (!printWindow || printWindow.closed) return;

            const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[character]);
            const money = value => new Intl.NumberFormat('es-EC', {
                style: 'currency', currency: 'USD'
            }).format(Number(value ?? 0));
            const formatDate = value => new Intl.DateTimeFormat('es-EC', {
                dateStyle: 'short', timeStyle: 'short'
            }).format(new Date(value));
            const details = Array.from(invoice.details ?? []);
            const rows = details.map(detail => `
                <tr>
                    <td>${escapeHtml(detail.productId)}</td>
                    <td>${escapeHtml(detail.productName)}</td>
                    <td class="number">${money(detail.unitPrice)}</td>
                    <td class="center">${escapeHtml(detail.quantity)}</td>
                    <td class="number">${money(Number(detail.unitPrice ?? 0) * Number(detail.quantity ?? 0))}</td>
                </tr>`).join('');

            const html = `<!doctype html><html lang="es"><head><meta charset="utf-8">
                <title>Factura ${escapeHtml(invoice.invoiceNumber)}</title>
                <style>
                    @page { size: A4 portrait; margin: 14mm; }
                    * { box-sizing: border-box; }
                    body { margin: 0; color: #111; font: 10pt Arial, sans-serif; }
                    .header { display: flex; justify-content: space-between; gap: 12mm; padding-bottom: 6mm; border-bottom: 1.5pt solid #333; }
                    .company { line-height: 1.35; color: #444; font-size: 8.5pt; }
                    .company h1 { margin: 0 0 1mm; color: #111; font-size: 21pt; }
                    .invoice-box { width: 82mm; padding: 3mm; text-align: center; background: #f2f2f2; border: 1px solid #bbb; }
                    .invoice-box strong { display: block; font-size: 14pt; }
                    .muted { color: #555; }
                    .info { display: grid; grid-template-columns: 1fr 1fr; gap: 8mm; margin: 5mm 0; padding: 3mm; background: #f2f2f2; border: 1px solid #bbb; }
                    .info h2 { margin: 0 0 2mm; font-size: 9pt; }
                    .info p { margin: 1mm 0; font-size: 8.5pt; }
                    table { width: 100%; border-collapse: collapse; margin-top: 5mm; font-size: 8.5pt; }
                    thead { display: table-header-group; }
                    th { padding: 2mm; color: #fff; background: #111; text-align: left; }
                    td { padding: 2mm; border-bottom: 1px solid #bbb; }
                    .number { text-align: right; white-space: nowrap; }
                    .center { text-align: center; }
                    .bottom { display: grid; grid-template-columns: 1fr 72mm; gap: 8mm; margin-top: 5mm; break-inside: avoid; }
                    .notes { padding: 3mm; background: #f2f2f2; border: 1px solid #bbb; font-size: 8pt; }
                    .totals { border: 1px solid #bbb; }
                    .total-row { display: flex; justify-content: space-between; padding: 2mm 3mm; border-bottom: 1px solid #bbb; }
                    .grand-total { color: #fff; background: #111; font-size: 10pt; font-weight: bold; }
                    @media screen { body { max-width: 190mm; margin: 12mm auto; } }
                </style></head><body>
                <header class="header">
                    <section class="company"><h1>NORTHWIND</h1>
                        Soluciones Comerciales &amp; Distribución<br>RUC: 1792048956001<br>
                        Av. Amazonas N24-196 y Luis Cordero, Quito - Ecuador<br>contacto@northwind.com | Telf: (02) 298-5400
                    </section>
                    <section class="invoice-box">FACTURA ELECTRÓNICA<strong>${escapeHtml(invoice.invoiceNumber)}</strong>
                        <span class="muted">Fecha: ${escapeHtml(formatDate(invoice.orderDate))}</span>
                    </section>
                </header>
                <section class="info">
                    <div><h2>DATOS DEL CLIENTE</h2>
                        <p><b>Razón Social:</b> ${escapeHtml(invoice.customerName)}</p>
                        <p><b>RUC / C.I.:</b> ${escapeHtml(invoice.customerIdentification)}</p>
                        ${invoice.customerAddress ? `<p><b>Dirección:</b> ${escapeHtml(invoice.customerAddress)}</p>` : ''}
                    </div>
                    <div><h2>DATOS DE ENTREGA</h2>
                        <p><b>Dirección:</b> ${escapeHtml(invoice.shipAddress || 'Misma del cliente')}</p>
                        <p><b>Ciudad/País:</b> ${escapeHtml(`${invoice.shipCity ?? ''}, ${invoice.shipCountry ?? ''}`)}</p>
                        ${invoice.shipPostalCode ? `<p><b>Cód. Postal:</b> ${escapeHtml(invoice.shipPostalCode)}</p>` : ''}
                    </div>
                </section>
                <table><thead><tr><th>CÓDIGO</th><th>DESCRIPCIÓN</th><th class="number">PRECIO</th><th class="center">CANT.</th><th class="number">TOTAL</th></tr></thead>
                    <tbody>${rows}</tbody></table>
                <section class="bottom">
                    <div class="notes"><b>INFORMACIÓN ADICIONAL</b><p>Forma de Pago: Efectivo</p>
                        Documento emitido conforme a las regulaciones tributarias vigentes.
                    </div>
                    <div class="totals">
                        <div class="total-row"><b>SUBTOTAL:</b><span>${money(invoice.subtotal)}</span></div>
                        <div class="total-row"><b>IVA (15%):</b><span>${money(invoice.tax)}</span></div>
                        <div class="total-row grand-total"><b>TOTAL A PAGAR:</b><span>${money(invoice.total)}</span></div>
                    </div>
                </section>
                <script>window.addEventListener('load', () => window.setTimeout(() => window.print(), 300), { once: true });<\/script>
                </body></html>`;

            printWindow.document.open();
            printWindow.document.write(html);
            printWindow.document.close();
            printWindow.focus();
        };

        window.closeInvoicePrintWindow = (windowId) => {
            const printWindow = invoicePrintWindows.get(windowId);
            invoicePrintWindows.delete(windowId);
            if (printWindow && !printWindow.closed) printWindow.close();
        };

        const searchInputPatterns = {
            digits: /^[0-9]+$/,
            letters: /^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]+$/,
            alphanumeric: /^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ\s]+$/,
            'alphanumeric-hyphen': /^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ\s-]+$/,
            'gmail-email': /^[a-zA-Z0-9.@]+$/,
            decimal: /^[0-9.]$/
        };
        document.addEventListener('keypress', function (e) {
            const input = e.target;
            if (!input || !input.getAttribute) return;
            const filterType = input.getAttribute('data-filter');
            const pattern = searchInputPatterns[filterType];
            if (!pattern || e.key.length !== 1) return;

            if (!pattern.test(e.key)) {
                e.preventDefault();
                return;
            }

            const maxLength = Number(input.getAttribute('maxlength'));
            if (Number.isFinite(maxLength) && maxLength > 0) {
                const selectedLength = (input.selectionEnd ?? input.value.length) - (input.selectionStart ?? input.value.length);
                if (input.value.length - selectedLength >= maxLength)
                    e.preventDefault();
            }
        }, true);

        // Interceptor global para inputs con restricción de caracteres en tiempo real
        document.addEventListener('beforeinput', function (e) {
            const input = e.target;
            if (!input || !input.getAttribute) return;

            // Bloquear signo negativo '-' y '+' en inputs numéricos no negativos
            const minAttr = input.getAttribute('min');
            if (minAttr !== null && parseFloat(minAttr) >= 0) {
                if (e.data === '-' || e.data === '+') {
                    e.preventDefault();
                    return;
                }
            }

            const filterType = input.getAttribute('data-filter');
            if (!filterType) return;
            
            if (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward' || !e.data) {
                return;
            }

            let regex;
            if (filterType === 'digits') {
                regex = /^[0-9]+$/;
            } else if (filterType === 'letters') {
                regex = /^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]+$/;
            } else if (filterType === 'alphanumeric') {
                regex = /^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ\s]+$/;
            } else if (filterType === 'alphanumeric-hyphen') {
                regex = /^[a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ\s\-]+$/;
            } else if (filterType === 'gmail-email') {
                regex = /^[a-zA-Z0-9.@]+$/;
            } else if (filterType === 'decimal') {
                regex = /^[0-9.]+$/;
            }

            if (regex && !regex.test(e.data)) {
                e.preventDefault();
            }
        }, true);

        document.addEventListener('input', function (e) {
            const input = e.target;
            if (!input || !input.getAttribute) return;

            // Limpiar signo negativo en inputs con min="0" si se pegó o forzó
            const minAttr = input.getAttribute('min');
            if (minAttr !== null && parseFloat(minAttr) >= 0 && input.value && input.value.includes('-')) {
                input.value = input.value.replace(/-/g, '');
                input.dispatchEvent(new Event('input', { bubbles: true }));
                return;
            }

            const filterType = input.getAttribute('data-filter');
            if (!filterType) return;

            let val = input.value;
            let filtered = val;
            if (filterType === 'digits') {
                filtered = val.replace(/\D/g, '');
            } else if (filterType === 'letters') {
                filtered = val.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]/g, '');
            } else if (filterType === 'alphanumeric') {
                filtered = val.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ\s]/g, '');
            } else if (filterType === 'alphanumeric-hyphen') {
                filtered = val.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑüÜ\s\-]/g, '');
            } else if (filterType === 'gmail-email') {
                filtered = val.replace(/[^a-zA-Z0-9.@]/g, '');
            } else if (filterType === 'decimal') {
                const numericCharacters = val.replace(/[^0-9.]/g, '');
                const decimalPoint = numericCharacters.indexOf('.');
                filtered = decimalPoint < 0
                    ? numericCharacters
                    : numericCharacters.slice(0, decimalPoint + 1) + numericCharacters.slice(decimalPoint + 1).replace(/\./g, '');
            }
            const max = input.getAttribute('maxlength');
            if (max && filtered.length > parseInt(max)) {
                filtered = filtered.substring(0, parseInt(max));
            }
            if (val !== filtered) {
                input.value = filtered;
                input.dispatchEvent(new Event('input', { bubbles: true }));
            }
        }, true);
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
